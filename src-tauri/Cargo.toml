[package]
name = "convertanything"
version = "1.0.0"
description = "Convert images, video, audio, documents and data files on your device"
authors = ["ConvertAnything"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "convertanything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
